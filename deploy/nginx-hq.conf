# Nyuman HQ derrière Nginx, comme nyuman-api (Cloudflare devant pour le HTTPS).
# À copier dans /etc/nginx/sites-available/nyuman-hq, puis :
#   sudo ln -s /etc/nginx/sites-available/nyuman-hq /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name hq.nyuman.com;  # à adapter si l'équipe choisit une autre adresse

    # Captures des retours (6 × 8 Mo au plus) et tableau .xlsx (5 Mo au plus).
    client_max_body_size 60m;

    access_log /var/log/nginx/hq-access.log;
    error_log /var/log/nginx/hq-error.log;

    # Le direct de la maison (Server-Sent Events) : pas de tampon, connexion longue.
    location = /api/flux {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
