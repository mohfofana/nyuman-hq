name: Tests

# À chaque envoi : les tests du serveur (sur SQLite et sur Postgres, comme en production) et ceux de l'interface.
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hq
          POSTGRES_PASSWORD: hq
          POSTGRES_DB: hq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hq" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests sur SQLite
        run: python -m pytest -q
      - name: Migrations sur une base Postgres neuve
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql://hq:hq@localhost:5432/hq_test
          ENVIRONMENT: test
          HQ_SESSION_SECRET: secret-de-test-qui-fait-plus-de-32-caracteres
      - name: Tests sur Postgres
        run: python -m pytest -q
        env:
          HQ_TEST_DATABASE_URL: postgresql://hq:hq@localhost:5432/hq_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
